id: 001-msh9-evn1-disagreement
status: todo
title: MSH-9 and EVN-1 disagree on the trigger event
summary: >-
  MSH-9 carries A01 (ADT^A01^ADT_A01) while EVN-1 carries A08, and the visit
  started four days before the message (PV1-44 is 2026-09-25, MSH-7 is
  2026-09-29). This is typical of an engine remapping A08 to A01 for a receiver
  that only accepts admits. The point of the case is whether the conversion
  report notices the disagreement.
notes: >-
  Offsets corrected to +0930 (ACST, Adelaide). The version posted on
  chat.fhir.org on 2026-10-06 used +1000 in error. The offset is not part of
  what this case tests.

v2_version: "2.5"
message_type: ADT^A01^ADT_A01
trigger_event: A01          # from MSH-9.2, which is authoritative; EVN-1 carries A08
hop: v2-to-enterprise
transaction: ADT feed, no IHE profile claimed
actors:
  sender: PAS (RIVERLAND)
  receiver: GW (RCVFAC)
initiates_workflow: false

validation:
  fhir_version: "4.0.1"
  packages:
    - {name: hl7.fhir.r4.core, version: 4.0.1}
  snomed_edition: "900000000000207008"   # International; the message carries no SNOMED CT codes
  scope: bundle-and-entries

