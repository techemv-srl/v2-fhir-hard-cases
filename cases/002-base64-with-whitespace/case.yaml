id: 002-base64-with-whitespace
status: todo
title: Base64 attachment with embedded whitespace
summary: >-
  ORU^R01 with a one-page PDF report embedded in OBX-5 (OBX-2 = ED, encoding
  Base64). The Base64 text contains spaces at five points: two on 4-character
  boundaries, two inside a 4-character group (one of them a double space), and
  one immediately before the padding. A strict Base64 decoder rejects the value
  as sent; implementations variously reject the message, strip the whitespace
  before decoding, or copy the text verbatim into Attachment.data. A pass means
  the attachment decodes to exactly the bytes of attachments/synthetic-report.pdf
  (SHA-256 below).

